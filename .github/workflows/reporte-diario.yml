name: Reporte diario

# Todos los días a las 8:00 de Argentina (11:00 UTC), o a mano desde la pestaña Actions.
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: reporte-diario
  cancel-in-progress: true

jobs:
  generar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Generar datos de prueba
        run: python -m scripts.generar_datos --cantidad 600 --dias 90 --semilla ${{ github.run_number }}

      - name: Generar reporte
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m scripts.reporte_diario
          mkdir -p sitio
          cp reportes/reporte_*.html sitio/index.html

      - name: Guardar el reporte como archivo descargable
        uses: actions/upload-artifact@v4
        with:
          name: reporte-diario
          path: reportes/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - name: Publicar en GitHub Pages
        id: publicar
        uses: actions/deploy-pages@v4
